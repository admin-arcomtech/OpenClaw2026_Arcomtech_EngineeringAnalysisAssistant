version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: arcom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arcom_user
      POSTGRES_PASSWORD: arcom_pass
      POSTGRES_DB: arcom_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcom_user -d arcom_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arcom_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://arcom_user:arcom_pass@postgres:5432/arcom_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_HOURS: ${JWT_ACCESS_TOKEN_EXPIRE_HOURS:-8}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # ── Openclaw Gateway (Sprint 3 AI Core) ──
      AI_ENABLED: ${AI_ENABLED:-true}
      OPENCLAW_BASE_URL: ${OPENCLAW_BASE_URL:-http://host.docker.internal:18789/v1}
      OPENCLAW_TOKEN: ${OPENCLAW_TOKEN:-}
      OPENCLAW_CHAT_MODEL: ${OPENCLAW_CHAT_MODEL:-openclaw/default}
      OPENCLAW_EMBEDDING_MODEL: ${OPENCLAW_EMBEDDING_MODEL:-openclaw/default}
      OPENCLAW_CHAT_BACKEND_MODEL: ${OPENCLAW_CHAT_BACKEND_MODEL:-}
      OPENCLAW_EMBEDDING_BACKEND_MODEL: ${OPENCLAW_EMBEDDING_BACKEND_MODEL:-}
      OPENCLAW_LLM_TIMEOUT_S: ${OPENCLAW_LLM_TIMEOUT_S:-60}
      OPENCLAW_EMBEDDING_TIMEOUT_S: ${OPENCLAW_EMBEDDING_TIMEOUT_S:-30}
      OPENCLAW_EMBEDDINGS_ENABLED: ${OPENCLAW_EMBEDDINGS_ENABLED:-false}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      UPLOAD_DIR: /tmp/arcom_uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    command: >
      sh -c "
        alembic upgrade head &&
        python seed.py &&
        python seed_cases.py &&
        (python embed_existing.py || echo 'embed_existing failed, continuing') &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    volumes:
      - ./backend:/app
      - arcom_uploads:/tmp/arcom_uploads

  frontend:
    image: node:20-alpine
    container_name: arcom_frontend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  arcom_uploads:
  frontend_node_modules:
